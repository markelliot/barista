name: Check PR
on:
  push:
    branches: [develop]
  pull_request: {}
jobs:
  build:
    name: Check PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "zulu"
      - name: Build
        run: ./gradlew build -i
